# AeroSpace config. Docs: https://nikitabobko.github.io/AeroSpace/guide
# Reload after editing: alt-shift-; then esc
# Lives in ~/dotfiles/aerospace (linked here by GNU Stow); changes push to GitHub hourly.

config-version = 2
persistent-workspaces = [
  '1', '2', '3', '4', '5', '6', '7', '8', '9',
  'A', 'B', 'C', 'D', 'E', 'G', 'I', 'M', 'N', 'O', 'P', 'Q', 'R',
  'S', 'T', 'U', 'V', 'W', 'X', 'Y', 'Z',
]

# Launch daily apps in the background when AeroSpace starts (it starts at login); on-window-detected rules below
# sort each one into its workspace.
after-startup-command = [
  "exec-and-forget open -g -a 'Ghostty'; open -g -a 'Zen'; open -g -a 'Claude'; open -g -a 'Obsidian'; open -g -a 'TickTick'; open -g -a 'Microsoft Outlook'; open -g -a 'Messages'; open -g -a 'Calendar'; open -g -a 'Discord'; open -g -a 'Spotify'",
]

start-at-login = true

# See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
# 'auto': wide monitor -> side by side, tall monitor -> stacked
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Cmd-H hides a window outside AeroSpace's control; unhide it automatically instead
automatically-unhide-macos-hidden-apps = true

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling' # toggle floating/tiling

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-a = ['workspace A', 'exec-and-forget open -a "Claude"']
alt-b = 'workspace B'
alt-c = ['workspace C', 'exec-and-forget open -a "Calendar"']
alt-d = ['workspace D', 'exec-and-forget open -a "Discord"']
alt-e = ['workspace E', 'exec-and-forget open -a "Finder"'] # E for Explorer
# alt-f is fullscreen
alt-g = 'workspace G'
alt-i = 'workspace I'
alt-m = ['workspace M', 'exec-and-forget open -a "Messages"']
alt-n = ['workspace N', 'exec-and-forget open -a "Microsoft Outlook"']
alt-o = ['workspace O', 'exec-and-forget open -a "Obsidian"']
alt-p = 'workspace P'
alt-q = 'workspace Q'
alt-r = 'workspace R'
alt-s = ['workspace S', 'exec-and-forget open -a "Spotify"']
alt-t = ['workspace T', 'exec-and-forget open -a "TickTick"']
alt-u = 'workspace U'
alt-v = 'workspace V'
alt-w = 'workspace W'
alt-x = 'workspace X'
alt-y = 'workspace Y'
alt-z = 'workspace Z'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-e = 'move-node-to-workspace E'
alt-shift-g = 'move-node-to-workspace G'
alt-shift-i = 'move-node-to-workspace I'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-n = 'move-node-to-workspace N'
alt-shift-o = 'move-node-to-workspace O'
alt-shift-p = 'move-node-to-workspace P'
alt-shift-q = 'move-node-to-workspace Q'
alt-shift-r = 'move-node-to-workspace R'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-u = 'move-node-to-workspace U'
alt-shift-v = 'move-node-to-workspace V'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-x = 'move-node-to-workspace X'
alt-shift-y = 'move-node-to-workspace Y'
alt-shift-z = 'move-node-to-workspace Z'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # toggle floating/tiling
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# App -> workspace rules. These run whenever a matching window opens.

# 2: terminal
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.during-aerospace-startup = true  # only sort the first window at login; later windows/tabs stay where you open them
run = ['move-node-to-workspace 2']

# 1: browsers
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.during-aerospace-startup = true  # only sort the first window at login; later windows/tabs stay where you open them
run = ['move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.during-aerospace-startup = true  # only sort the first window at login; later windows/tabs stay where you open them
run = ['move-node-to-workspace 1']

# A: AI apps
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace A']

[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = ['move-node-to-workspace A']

# O: Obsidian
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace O']

# T: TickTick
[[on-window-detected]]
if.app-id = 'com.TickTick.task.mac'
run = ['move-node-to-workspace T']

# N: Outlook
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace N']

# M: Messages
[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace M']

# C: Calendar
[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = ['move-node-to-workspace C']

# D: Discord
[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace D']

# S: Spotify
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['move-node-to-workspace S']

# E: Finder (floating: its windows come and go and tile awkwardly)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating', 'move-node-to-workspace E']

# Floating: apps that don't tile well

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']
